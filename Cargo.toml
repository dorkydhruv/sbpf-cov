[package]
name = "sbpf-cov"
edition = "2021"
version = "0.1.9"
authors = ["Claire Fan <claire@blueshift.gg>"]
description = "Upstream BPF linker for SBPF V0/V3 programs"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/blueshift-gg/sbpf-linker"
repository = "https://github.com/blueshift-gg/sbpf-linker"
keywords = ["cli", "sbpf", "linker", "solana"]
categories = ["command-line-utilities"]

[lib]
crate-type = ["cdylib", "lib"]
name = "sbpf_cov"

[dependencies]
sbpf-assembler = "0.2.4"
sbpf-common = "0.2.4"
clap = { workspace = true }
either = { version = "1.16.0", features = ["serde"] }
object = { version = "0.36.0", features = ["write"] }
bpf-linker = { version = "0.10.2", default-features = false }
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gimli = "0.31"

tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-tree = "0.4"

tracing = "0.1"
anyhow = { workspace = true }
which = { version = "8.0.5", default-features = false, features = ["real-sys", "regex"] }
walkdir = { workspace = true }

[dev-dependencies]
compiletest_rs = "0.11.2"
tempfile = "3.10"
regex = { version = "1.13.1", default-features = false }
rustc-build-sysroot = "0.5.2"
which = { version = "8.0.5", default-features = false, features = [
    "real-sys",
    "regex",
] }

[[bin]]
name = "sbpf-cov"
path = "src/bin/sbpf-cov.rs"

[[bin]]
name = "cargo-sbpf-cov"
path = "src/bin/cargo-sbpf-cov.rs"

[[bin]]
name = "sbpf-linker"
path = "src/bin/sbpf-linker.rs"

[[test]]
name = "tests"
path = "tests/tests.rs"

[workspace]
members = ["xtask", "examples/rust-example", "examples/c-example", "examples/java-example", "interposer"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5.31", features = ["derive"] }
walkdir = "2.5.0"


[workspace.package]
edition = "2021"

[features]
default = ["bpf-linker/default"]

